openapi: 3.1.0
info:
  title: GPT DB Manager
  description: API for managing data in Google Sheets via Apps Script
  version: '1.0'
servers:
  - url: https://script.google.com/macros/s/AKfycbwu5ikFRMKfg_ao0fVyksfvjtGQO3ttsmhDUGRFSyoyp6P6OpiF8-PErD7JeEro3s4/exec
paths:
  /:
    post:
      summary: Perform a database action
      operationId: manageDatabase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                table:
                  type: string
                row_data:
                  type: object
                filter:
                  type: object
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
