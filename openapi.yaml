openapi: 3.1.0
info:
  title: GPT DB Manager
  description: API to manage Google Sheets database via Google Apps Script.
  version: "1.0"
servers:
  - url: "https://script.google.com/macros/s/AKfycbxgCe3BoBJCvysUGEJHv7-rhXZdEmUE2UvoAhufFzGVUya87IApWCF31-wwRepRpbc/exec"
paths:
  /:
    post:
      summary: Manage database
      operationId: manageDatabase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                table:
                  type: string
                row_data:
                  type: object
                  additionalProperties:
                    type: string
                filter:
                  type: object
                  additionalProperties:
                    type: string
              required:
                - action
                - table
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  details:
                    type: object
